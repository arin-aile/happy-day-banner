name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site from app/
        run: |
          mkdir -p _site
          cp -R app/. _site/
          # app/index.html is written for the artifact host, which adds the doctype and viewport; add them here.
          { printf '<!doctype html>\n<html lang="ko">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'; cat app/index.html; } > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
